<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop POS</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--bd:#e3e6ea;--ac:#1d6fe8;--on:#fff;--ok:#12805c;--bad:#c2362b;--warn:#a15c00;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mu:#98a1ad;--bd:#2d333b;--ac:#5b9bff;--on:#0b1220;--ok:#43c59e;--bad:#ff7b72;--warn:#e3b341;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#eceff3;--mu:#98a1ad;--bd:#2d333b;--ac:#5b9bff;--on:#0b1220;--ok:#43c59e;--bad:#ff7b72;--warn:#e3b341;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:calc(15px*var(--fs,1));line-height:1.4;padding:12px;max-width:1280px;margin:0 auto}
h1{font-size:calc(18px*var(--fs,1));margin:0}h3{margin:0 0 8px;font-size:calc(15px*var(--fs,1))}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hr{display:flex;gap:6px;align-items:center}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.pri,button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
button.bad{color:var(--bad)}button.sm{padding:3px 9px;font-size:calc(13px*var(--fs,1))}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
input[type=checkbox]{width:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.mb{margin-bottom:12px}
.sell{display:grid;grid-template-columns:1fr 360px;gap:12px;align-items:start}
@media(max-width:900px){.sell{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{padding:4px 10px;border-radius:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(150px*var(--box,1)),1fr));gap:8px}
.p{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px}
.mu,.p small{color:var(--mu)}
.p.out{opacity:.45}
.line{border-bottom:1px solid var(--bd);padding:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.row button{padding:2px 9px}
.sc{display:flex;gap:6px;margin-bottom:8px}.sc button{white-space:nowrap}
label{display:block;margin:8px 0 2px;color:var(--mu);font-size:calc(13px*var(--fs,1))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.kpis b{display:block;font-size:calc(20px*var(--fs,1))}.kpis .card{cursor:default}.kpis .card[data-a]{cursor:pointer}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:600;font-size:calc(13px*var(--fs,1))}
tr.hl td{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.low{color:var(--bad);font-weight:600}.okc{color:var(--ok);font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:calc(12px*var(--fs,1));border:1px solid var(--bd);color:var(--mu)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}.tag.warn{color:var(--warn);border-color:var(--warn)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
.fcol label:first-child{margin-top:0}
.pre{white-space:pre-line}.right{text-align:right}.grow{flex:1}.big{font-size:calc(22px*var(--fs,1))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.dx{display:grid;gap:14px}.dx-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.dx-title{font-size:calc(24px*var(--fs,1));font-weight:600;margin:0}.dx-lede{margin:6px 0 0;color:var(--mu);max-width:64ch;min-height:1.4em}.dx-lede b{color:inherit;font-weight:600}
.dx-seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}.dx-seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;color:var(--mu);cursor:pointer;box-shadow:none}.dx-seg button.on{background:var(--ac);color:#fff}
.dx-range{font-size:calc(12px*var(--fs,1));color:var(--mu);text-align:right;margin-top:4px}
.dx-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.dx-tile .v{font-size:calc(24px*var(--fs,1));font-weight:600;margin:4px 0;font-variant-numeric:tabular-nums}.dx-delta{font-size:calc(12px*var(--fs,1));color:var(--mu)}
.dx-good{color:var(--ok)}.dx-bad{color:var(--bad)}.dx-defs{font-size:calc(12px*var(--fs,1));color:var(--mu);margin:-4px 0 0}
.dx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.dx-card{min-width:0}.dx-card h2{font-size:calc(16px*var(--fs,1));margin:0 0 2px}.dx-note{font-size:calc(12px*var(--fs,1));color:var(--mu);margin:2px 0 10px}
.dx-legend{display:flex;gap:14px;font-size:calc(12px*var(--fs,1));color:var(--mu);flex-wrap:wrap}.dx-sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.dx-chart{position:relative;min-height:240px}.dx-tip{position:absolute;z-index:2;pointer-events:none;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font-size:calc(12px*var(--fs,1));white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.dx-mix{display:grid;gap:12px}.dx-mrow{display:grid;grid-template-columns:minmax(90px,130px) 1fr;gap:8px;align-items:center}.dx-mrow .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx-mline{display:flex;align-items:center;gap:6px;margin:2px 0}.dx-bar{height:10px;min-width:2px;border-radius:4px}.dx-mv{font-size:calc(12px*var(--fs,1));color:var(--mu)}
.dx-pay{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden}.dx-pkeys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}.dx-pkeys .pv{font-size:calc(18px*var(--fs,1));font-weight:600}
.dx-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.dx-table th{text-align:left;font-size:calc(12px*var(--fs,1));font-weight:500;color:var(--mu);padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}.dx-table td{padding:6px 8px;border-bottom:1px solid var(--bd)}.dx-table .num{text-align:right;white-space:nowrap}
.dx-table th button{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;box-shadow:none}.dx-table th[aria-sort=descending] button:after{content:" ↓"}.dx-table th[aria-sort=ascending] button:after{content:" ↑"}
.dx-scroll{max-height:26rem;overflow:auto}.dx-rc{display:flex;align-items:center;justify-content:flex-end;gap:8px}.dx-rt{flex:1;max-width:80px;height:6px}
.qas{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(180px*var(--box,1)),1fr));gap:10px;margin:12px 0}.qa{cursor:pointer;display:flex;flex-direction:column;gap:2px}.qa b{font-size:calc(16px*var(--fs,1))}
html[dir=rtl] td,html[dir=rtl] th{text-align:right}html[dir=rtl] .right{text-align:left}html[dir=rtl] .row,html[dir=rtl] .form{direction:rtl}
#msg{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;display:none;z-index:50;max-width:90%;text-align:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
#modal .card{max-width:360px;width:100%;max-height:92%;overflow:auto}#modal .card.wide{max-width:760px}
#lock{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:40}
#lock .card{width:300px;text-align:center}
@media print{body{zoom:1!important}html{--fs:1!important;--pic:1!important;--box:1!important}}
.th{width:calc(44px*var(--pic,1));height:calc(44px*var(--pic,1));object-fit:var(--pfit,contain);border-radius:8px;flex:none;background:rgba(127,127,127,.08)}.pimg{display:block;width:100%;height:calc(100px*var(--pic,1));object-fit:var(--pfit,contain);object-position:center;border-radius:8px;margin-bottom:6px;background:rgba(127,127,127,.08)}.banner{display:block;width:auto;max-width:100%;height:auto;max-height:calc(200px*var(--pic,1));margin:0 auto 10px;border-radius:12px}.zm{display:inline-flex;gap:2px}.sqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(130px*var(--box,1)),1fr));gap:10px;margin-bottom:12px}.sqb{cursor:pointer;text-align:center;padding:10px}.sqb.on{border:2px solid var(--ac);padding:9px}.sqimg{display:block;width:100%;height:calc(70px*var(--pic,1));object-fit:var(--pfit,contain);border-radius:8px;margin-bottom:6px}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block!important;padding:0}#modal .card{max-width:100%;border:0;max-height:none}#modal button{display:none}}
</style></head>
<body>
<header><div class="hr"><img id="logo" alt="" style="display:none;height:34px;border-radius:6px"><h1 id="title">Shop POS</h1></div>
<div class="hr"><span id="sync" class="mu"></span><button id="lockb" class="sm" style="display:none" data-a="lock">Lock</button><span class="zm"><button class="sm" data-a="zout" title="Zoom out">−</button><button class="sm" id="zpct" data-a="zreset" title="Reset zoom">100%</button><button class="sm" data-a="zin" title="Zoom in">+</button></span><button class="sm" data-a="dspopen" title="Text, picture and box size">Size</button><button class="sm" data-a="calcopen">Calculator</button><button class="sm" data-a="theme">Light / Dark</button></div></header>
<nav id="nav"></nav>
<div id="tabpic"></div>
<main id="main"></main>
<div id="msg"></div>
<div id="modal"><div class="card" id="rcpt"></div></div>
<div id="lock"><div class="card" style="width:min(380px,92vw)"><div id="lkhead" style="text-align:center;margin-bottom:12px"></div><label>Username</label><input id="luser" autocomplete="username" autocapitalize="off" spellcheck="false">
<label>Password</label><div style="position:relative"><input id="pin" type="password" autocomplete="current-password"><button class="sm" data-a="eye" type="button" style="position:absolute;right:4px;top:4px;border:0;background:none" aria-label="Show or hide the password">Show</button></div>
<div class="row" style="margin-top:6px"><span id="pinerr" class="low"></span><button class="pri" data-a="unlock">Sign in</button></div><div style="margin-top:10px"><a href="#" data-a="forgot" class="mu" style="font-size:13px">Forgot the owner password?</a></div></div></div>
<script>
const TOKEN="__TOKEN__";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let SET={},INFO={},tab="home",ME={user:"",role:"owner",has_users:false},LANG="en",PROV="alfa",TMODE="sell",AMODE="svc";
const PROV_APIS=new Set(["alfa_state","alfa_services","alfa_service_save","alfa_cards","alfa_card_save","alfa_adjust","alfa_set","alfa_adjustments","alfa_log","validity_cards","validity_sale","alfa_sell","validity_presets","preset_save"]);
const cur=()=>SET.currency||"$";
const fix=n=>Math.round((+n||0)*100)/100;
const money=n=>{n=fix(n);return(n<0?"-":"")+cur()+Math.abs(n).toFixed(2)};
const rate=()=>+SET.lbp_rate||0;
const lbp=n=>Math.round((+n||0)*rate()).toLocaleString("en-US")+" L.L";
const both=n=>money(n)+(rate()?` <small class="mu">(${lbp(n)})</small>`:"");
const toUSD=v=>SL.cur==="LBP"?(+v||0)/(rate()||1):(+v||0);
const applyAccent=()=>{const r=document.documentElement.style;r.setProperty("--pfit",SET.pic_fit==="cover"?"cover":"contain");if(SET.accent)r.setProperty("--ac",SET.accent);else r.removeProperty("--ac")};
const lpaid=s=>{const t=(s.payments||[]).reduce((a,p)=>a+(p.cur==="LBP"?+p.amount_lbp||0:0),0);return t>0?`<div class="row mu"><span>Paid in L.L</span><span>${Math.round(t).toLocaleString("en-US")} L.L</span></div>`:""};
const fd=s=>s?String(s).slice(0,10):"",ft=s=>s?String(s).slice(0,16):"";
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const mstart=()=>new Date().toISOString().slice(0,8)+"01";
const todayS=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const METHODS=["Cash","Card","Transfer"];
async function api(name,args={}){
  if(PROV_APIS.has(name)&&args.provider===undefined)args={...args,provider:PROV};
  if(name==="open_url"&&!/^(127\.0\.0\.1|localhost)$/.test(location.hostname)){window.open(args.url,"_blank");return true}
  const r=await fetch("/api/"+name,{method:"POST",headers:{"Content-Type":"application/json","X-Token":TOKEN,"X-Session":sessionStorage.getItem("sess")||""},body:JSON.stringify(args)});
  const j=await r.json();if(!j.ok){if(j.error==="LOCKED")showLock();throw new Error(j.error)}return j.data}
async function act(name,args={},ok){try{const d=await api(name,args);if(ok)toast(ok);return{d}}catch(e){
  if(e.message==="OWNER_PIN"){const f=await askForm("Owner password required",[{k:"p",l:"Owner password",t:"password"}],{},"Confirm");if(f&&f.p)return act(name,{...args,_opin:f.p},ok);return null}
  if(e.message==="LOCKED")return null;
  toast(e.message);return null}}
function toast(t,ms=2800){const m=$("#msg");m.textContent=t;m.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display="none",ms)}
function sure(b,fn){if(b.dataset.s){fn();return}b.dataset.s=1;const o=b.textContent;b.textContent="Tap again";setTimeout(()=>{delete b.dataset.s;b.textContent=o},3000)}
const tag=t=>`<span class="tag ${({Paid:"ok",Active:"ok",Ready:"ok",Delivered:"ok",Overdue:"bad",Expired:"bad",Upcoming:"warn",Open:"warn","In repair":"warn"})[t]||""}">${esc(t)}</span>`;
const T=(heads,rows,empty="Nothing here yet.")=>`<div class="card wrap"><table><tr>${heads.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.join("")||`<tr><td colspan="${heads.length}" class="mu">${empty}</td></tr>`}</table></div>`;
const opts=(list,sel)=>list.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return`<option value="${esc(v)}"${String(v)===String(sel)?" selected":""}>${esc(l)}</option>`}).join("");
const ACT={},INP={},CHG={};
let modalClose=null;
function openModal(html,wide){$("#rcpt").className="card"+(wide?" wide":"");$("#rcpt").innerHTML=html;$("#modal").style.display="flex"}
function closeModal(){$("#modal").style.display="none";$("#rcpt").innerHTML="";const f=modalClose;modalClose=null;if(f)f()}
$("#modal").addEventListener("mousedown",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").style.display==="flex")closeModal();
  if(e.key==="F2"){tab==="sell"?$("#bc")&&$("#bc").focus():go("sell");e.preventDefault()}
  if(e.key==="F9"&&tab==="sell"){complete();e.preventDefault()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b,e)});
document.addEventListener("input",e=>{const f=e.target.dataset.i;if(f&&INP[f])INP[f](e.target)});
document.addEventListener("change",e=>{const f=e.target.dataset.c;if(f&&CHG[f])CHG[f](e.target)});
function askForm(title,fields,vals={},okText="Save"){
  return new Promise(res=>{
    const fh=fields.map(f=>{const v=vals[f.k]==null?"":vals[f.k];let c;
      if(f.t==="select")c=`<select name="${f.k}">${opts(f.o,v)}</select>`;
      else if(f.t==="textarea")c=`<textarea name="${f.k}" rows="4" placeholder="${esc(f.ph||"")}">${esc(v)}</textarea>`;
      else c=`<input name="${f.k}" type="${f.t||"text"}" ${f.t==="number"?'step="any"':""} value="${esc(v)}" placeholder="${esc(f.ph||"")}">`;
      return`<label>${esc(f.l)}</label>${c}`}).join("");
    let done=false;const fin=v=>{if(done)return;done=true;modalClose=null;res(v)};
    openModal(`<h3>${esc(title)}</h3><form id="af" class="fcol">${fh}<div class="row" style="margin-top:12px"><button type="button" id="afx">Cancel</button><button class="pri">${esc(okText)}</button></div></form>`,fields.some(f=>f.wide));
    modalClose=()=>fin(null);
    $("#af").onsubmit=e=>{e.preventDefault();const d={};new FormData(e.target).forEach((v,k)=>d[k]=v);fin(d);closeModal()};
    $("#afx").onclick=()=>closeModal();
    const first=$("#af input,#af select,#af textarea");if(first)first.focus()})}
function pickList(title,items){ // items: [[value,label]]
  return new Promise(res=>{let done=false;modalClose=()=>{if(!done){done=true;res(null)}};
    openModal(`<h3>${esc(title)}</h3>${items.map((it,i)=>`<div class="row"><span>${esc(it[1])}</span><button class="pri sm" data-a="pick" data-i="${i}">Select</button></div>`).join("")||'<p class="mu">Nothing to choose.</p>'}<div class="row"><span></span><button data-a="mclose">Cancel</button></div>`);
    ACT.pick=b=>{done=true;modalClose=null;res(items[+b.dataset.i][0]);closeModal()}})}
ACT.mclose=()=>closeModal();

/* ================= receipt ================= */
function receiptHTML(s){
  const L=s.items.map(l=>`<div class="row"><span>${l.qty} × ${esc(l.name)}${l.imei?`<br><small class="mu">IMEI: ${esc(l.imei)}</small>`:""}${l.warranty_until?`<br><small class="mu">Warranty until ${fd(l.warranty_until)}</small>`:""}</span><span>${money(l.price*l.qty)}</span></div>`).join("");
  const inst=s.installments.length?`<hr><b>Installments</b>${s.installments.map(i=>`<div class="row"><span>#${i.no} · ${fd(i.due_date)}</span><span>${money(i.amount)}${i.paid>=i.amount-.005?" ✓":""}</span></div>`).join("")}`:"";
  return`${SET.logo?`<div style="text-align:center"><img src="${SET.logo}" alt="" style="max-height:70px;max-width:100%"></div>`:""}<h3 style="text-align:center">${esc(SET.shop_name)}</h3><div class="mu" style="text-align:center">${esc(SET.shop_phone)} ${esc(SET.shop_address)}<br>Receipt #${s.id} · ${ft(s.date)}${s.cname?"<br>"+esc(s.cname):""}</div><hr>${L}<hr>
  ${s.discount?`<div class="row"><span>Discount</span><span>−${money(s.discount)}</span></div>`:""}${s.points_value?`<div class="row"><span>Points used (${s.points_used})</span><span>−${money(s.points_value)}</span></div>`:""}
  <div class="row"><b>Total</b><b>${both(s.total)}</b></div><div class="row mu"><span>Paid</span><span>${both(s.paid)}</span></div>${lpaid(s)}
  ${s.balance>.004?`<div class="row"><b>Balance due</b><b>${both(s.balance)}</b></div>`:""}${inst}
  ${s.points_earned?`<div class="row mu"><span>Points earned</span><span>+${s.points_earned}</span></div>`:""}
  <hr><div class="mu" style="text-align:center">${esc(SET.receipt_footer)}</div>
  <div class="row"><button data-a="print">Print</button><button data-a="rwa">WhatsApp</button><button class="pri" data-a="mclose">Close</button></div>`}
let LASTR=null;const showReceipt=s=>{LASTR=s;openModal(receiptHTML(s))};
function waOpen(phone,text){let n=String(phone||"").replace(/\D/g,"");if(n){if(n.startsWith("00"))n=n.slice(2);else if(n.startsWith("0"))n=(SET.country_code||"961")+n.slice(1);else if(n.length<=8)n=(SET.country_code||"961")+n}
  api("open_url",{url:`https://wa.me/${n}?text=${encodeURIComponent(text)}`})}
function receiptText(s){return`${SET.shop_name}\nReceipt #${s.id} · ${ft(s.date)}\n`+s.items.map(l=>`${l.qty} x ${l.name} = ${money(l.price*l.qty)}`).join("\n")+`\nTotal: ${money(s.total)}${rate()?" ("+lbp(s.total)+")":""}\nPaid: ${money(s.paid)}`+(s.balance>.004?`\nBalance due: ${money(s.balance)}`:"")+`\n${SET.receipt_footer||""}`}
ACT.rwa=()=>{if(LASTR)waOpen(LASTR.cphone,receiptText(LASTR))};
ACT.printl=()=>{const st=$("#pagecss"),old=st?st.textContent:"";if(st)st.textContent="";window.onafterprint=()=>{if(st)st.textContent=old};window.print()};

function waLink(name,phone,amt){
  let n=String(phone||"").replace(/\D/g,"");if(!n)return toast("This customer has no phone number");

  api("open_url",{url:`https://wa.me/${n}?text=${encodeURIComponent(`Hello ${name}, this is a friendly reminder that you have an outstanding balance of ${money(amt)} at ${SET.shop_name}. Thank you!`)}`})}

const inCart=pid=>SL.cart.filter(l=>l.pid===pid).reduce((a,l)=>a+l.qty,0);
const sub=()=>SL.cart.reduce((a,l)=>a+l.price*l.qty,0);
const cust=()=>SL.custs.find(c=>String(c.id)===String(SL.cid));
const ptsUsed=()=>Math.max(0,Math.min(Math.floor(+SL.pts||0),cust()?cust().points:0));

function drawGrid(){drawTops();const t=SL.q.toLowerCase();
  const list=SL.prods.filter(p=>(SL.cat==="All"||p.category===SL.cat)&&(p.name+" "+(p.barcode||"")).toLowerCase().includes(t));
  $("#grid").innerHTML=list.map(p=>{const left=p.qty-inCart(p.id),out=!p.service&&left<=0;

INP.sbc=()=>{};

  const r=await act("scan",{code:c});if(!r)return;if(!r.d)return toast("Unknown barcode / IMEI: "+c);addProduct(r.d.product,r.d.imei)}});
ACT.addp=b=>addProduct(SL.prods.find(p=>String(p.id)===b.dataset.id));
async function addProduct(p,imei){
  const price=p.offer!=null?p.offer:p.price,ex=SL.cart.find(l=>l.pid===p.id&&!l.imei);
  if(p.service){ex?ex.qty++:SL.cart.push({id:SL.lid++,pid:p.id,name:p.name,qty:1,price,imei:"",svc:1})}
  else if(p.track_imei){
    const used=SL.cart.map(l=>l.imei);
    if(!imei){const list=(await api("imeis",{product_id:p.id})).filter(i=>i.status==="in_stock"&&!used.includes(i.imei));
      if(!list.length)return toast("No phones in stock for "+p.name);
      imei=list.length===1?list[0].imei:await pickList("Choose IMEI — "+p.name,list.slice(0,60).map(i=>[i.imei,i.imei]));if(!imei)return}
    if(used.includes(imei))return toast("That IMEI is already in the cart");
    SL.cart.push({id:SL.lid++,pid:p.id,name:p.name,qty:1,price,imei})}
  else{if(inCart(p.id)>=p.qty&&SET.allow_negative!=="1")return toast("No more stock");ex?ex.qty++:SL.cart.push({id:SL.lid++,pid:p.id,name:p.name,qty:1,price,imei:""})}
  drawCart();drawGrid()}
function drawCart(){
  $("#lines").innerHTML=SL.cart.length?SL.cart.map(l=>`<div class="line"><div class="row"><span>${esc(l.name)}${l.imei?`<br><small class="mu">IMEI ${esc(l.imei)}</small>`:""}</span><b>${money(l.price*l.qty)}</b></div>
  <div class="row"><span>${l.imei?"":`<button data-a="dec" data-id="${l.id}">−</button> ${l.qty} <button data-a="inc" data-id="${l.id}">+</button>`} <small class="mu">@ ${money(l.price)}</small> <button class="sm" data-a="ledit" data-id="${l.id}">Edit</button></span><button class="bad" data-a="rm" data-id="${l.id}">Remove</button></div></div>`).join(""):'<p class="mu">Tap a product or scan a barcode.</p>';upd()}
const line=id=>SL.cart.find(l=>String(l.id)===String(id));
ACT.rm=b=>{SL.cart=SL.cart.filter(l=>String(l.id)!==b.dataset.id);drawCart();drawGrid()};
ACT.inc=b=>{const l=line(b.dataset.id),p=SL.prods.find(p=>p.id===l.pid);if(!l.svc&&inCart(l.pid)>=p.qty&&SET.allow_negative!=="1")return toast("No more stock");l.qty++;drawCart();drawGrid()};
ACT.dec=b=>{const l=line(b.dataset.id);if(--l.qty<1)SL.cart=SL.cart.filter(x=>x!==l);drawCart();drawGrid()};
ACT.ledit=async b=>{const l=line(b.dataset.id),f=[{k:"price",l:"Unit price",t:"number"}];if(!l.imei)f.push({k:"qty",l:"Quantity",t:"number"});
  const d=await askForm(l.name,f,{price:l.price,qty:l.qty});if(!d)return;l.price=+d.price>=0?+d.price:l.price;if(d.qty!==undefined){const q=Math.floor(+d.qty);if(q>=1)l.qty=q}drawCart();drawGrid()};

  const r=await act("customer_save",d);if(!r)return;SL.custs=await api("customers_min");SL.cid=String(r.d);drawAside()};
function upd(){const t=total(),e=$("#tot");if(!e)return;e.innerHTML=money(t)+(rate()?` <small class="mu">${lbp(t)}</small>`:"");
  const c=$("#chg");if(c){const v=toUSD(SL.cash),fm=n=>SL.cur==="LBP"?lbp(n):money(n);c.textContent=SL.cash===""?"":v>=t-.004?"Change: "+fm(v-t):"Short by "+fm(t-v)}
  const i=$("#instinfo");if(i){const bal=Math.max(0,t-toUSD(SL.paid));i.textContent=SL.kind==="installment"?`Balance ${money(bal)} → ${SL.ninst||3} × ${money(bal/(+SL.ninst||3))}`:`Balance ${money(bal)}`}}

  if(!SL.cart.length)return toast("Cart is empty");
  const t=total(),r=await act("sale_create",{cart:SL.cart.map(l=>({pid:l.pid,qty:l.qty,price:l.price,imei:l.imei,name:l.name,cost:l.cost,topup:l.topup,player:l.player})),customer_id:SL.cid||null,discount:+SL.disc||0,points_used:ptsUsed(),
    paid:SL.kind==="cash"?t:(+SL.paid||0),cur:SL.cur,method:SL.method,kind:SL.kind,due:SL.due,notes:SL.notes,inst_n:+SL.ninst||3});
  if(!r)return;Object.assign(SL,{cart:[],disc:"",pts:"",cash:"",cid:"",kind:"cash",paid:"0",notes:"",due:""});await viewSell();showReceipt(r.d);toast("Sale saved")}

async function viewInv(){

  const cats=[...new Set(all.map(p=>p.category).filter(Boolean))];

  <div class="card mb"><h3>${IV.edit?"Edit product":"Add product"}</h3><div class="form" id="pf">
  <div><label>Name</label><input id="fn" value="${esc(e.name)}"></div><div><label>Category</label><input id="fc" list="cl" value="${esc(e.category)}"><datalist id="cl">${[...new Set(["Phones","Accessories","Alfa Cards","Touch Cards","Audio",...cats])].map(c=>`<option>${esc(c)}</option>`).join("")}</datalist></div>
  <div><label>Type</label><select id="ft">${opts(PTYPES,e.service?"service":e.track_imei?"imei":"stock")}</select></div>
  <div><label>Price</label><input id="fp" type="number" step="any" value="${esc(e.price)}"></div><div><label>Cost</label><input id="fo" type="number" step="any" value="${esc(e.cost)}"></div>
  <div><label>Stock ${IV.edit?"":"(phones: add IMEIs after saving)"}</label><input id="fs" type="number" value="${e.qty}"></div><div><label>Alert when stock ≤</label><input id="fm" type="number" value="${e.min_qty}"></div>
  <div><label>Barcode (blank = auto)</label><input id="fb" value="${esc(e.barcode)}"></div><div><label>Warranty (days)</label><input id="fw" type="number" value="${esc(e.warranty)}"></div>
  <div><button class="pri" data-a="psave">${IV.edit?"Save changes":"Add product"}</button> ${IV.edit?'<button data-a="pcancel">Cancel</button>':""}</div></div></div>
  <div class="card mb"><div class="form"><div><label>Search</label><input id="iq" data-i="iq" value="${esc(IV.q)}" placeholder="Name, barcode, IMEI"></div><div><label>Category</label><select data-c="icat">${opts(["All",...cats],IV.cat)}</select></div>
  <div><button data-a="ilow" class="${IV.low?"on":""}">Low stock only</button> <button data-a="plabels">Print labels</button> <button data-a="bulkp">Bulk price change</button> <button data-a="iexp">Export to Excel</button> <button data-a="iexp2">Export phone IMEIs</button> <span id="undoslot"></span></div></div></div><div id="ilist"></div>`;drawInv();if(!IV.edit){const sc=$("#isc");if(sc)sc.focus()}loadUndo()}
async function drawInv(){
  const l=await api("products",{q:IV.q,cat:IV.cat,low:IV.low}),val=l.filter(p=>!p.service).reduce((a,p)=>a+Math.max(0,p.qty)*p.cost,0);
  $("#ilist").innerHTML=T(["Name","Category","Price","Cost","Stock","Barcode",""],l.map(p=>`<tr><td>${p.img?`<img class="th" style="width:calc(30px*var(--pic,1));height:calc(30px*var(--pic,1));vertical-align:middle;margin-right:8px" alt="" src="${imgUrl(p.img)}">`:""}${esc(p.name)} ${p.track_imei?'<span class="tag">IMEI</span>':""}${p.alfa_service_id?`<span class="tag ok">${pn(p)} service</span>`:p.alfa_card_id?`<span class="tag ok">${pn(p)} card</span>`:p.service?'<span class="tag">Service</span>':""}${p.warranty?` <small class="mu">${p.warranty}d warranty</small>`:""}</td><td>${esc(p.category)}</td>
  <td>${p.offer!=null?`<s class="mu">${money(p.price)}</s> ${money(p.offer)}`:money(p.price)}</td><td>${p.alfa_service_id?p.alfa_amt+"$ "+pn(p):money(p.cost)}</td><td class="${!p.service&&p.qty<=p.min_qty?"low":""}">${p.service?"—":p.qty}</td><td>${esc(p.barcode)}</td>
  <td>${p.alfa_service_id?`<button class="sm" data-a="goto" data-t="${pn(p)==="Touch"?"touch":"alfa"}">Edit in ${pn(p)} tab</button>`:p.alfa_card_id?`<button class="sm" data-a="goto" data-t="${pn(p)==="Touch"?"touch":"alfa"}">Edit in ${pn(p)} tab</button>`:`<button class="sm" data-a="pedit" data-id="${p.id}">Edit</button> <button class="sm" data-a="plabel" data-id="${p.id}">Label</button> ${p.track_imei?`<button class="sm" data-a="pimei" data-id="${p.id}">IMEIs</button> `:""}<button class="sm bad" data-a="pdel" data-id="${p.id}">Delete</button>`}</td></tr>`))+`<p class="mu right">Stock value at cost: ${money(val)}</p>`}
INP.iq=el=>{IV.q=el.value;drawInv()};CHG.icat=el=>{IV.cat=el.value;drawInv()};
ACT.ilow=b=>{IV.low=IV.low?0:1;b.classList.toggle("on");drawInv()};
document.addEventListener("keydown",async e=>{if(e.target.id!=="isc"||e.key!=="Enter")return;e.preventDefault();const code=e.target.value.trim();e.target.value="";if(!code)return;
  const r=await act("scan",{code});if(!r)return;
  if(r.d){const p=r.d.product;
    if(p.track_imei){if(r.d.imei)return toast("This phone is already in stock: "+p.name);return ACT.pimei({dataset:{id:p.id}})}
    const f=await askForm("Add stock — "+p.name+" (now "+p.qty+")",[{k:"qty",l:"Quantity to add",t:"number"}],{qty:1},"Add");
    if(f&&await act("stock_add",{id:p.id,qty:f.qty},"Stock added")){await viewInv()}
    return}
  IV.edit=null;await viewInv();$("#fb").value=code;$("#fn").focus();toast("New barcode — type the name and the details, then Add product")});
ACT.pedit=b=>{IV.edit=+b.dataset.id;viewInv();window.scrollTo(0,0)};ACT.pcancel=()=>{IV.edit=null;viewInv()};
ACT.pdel=b=>sure(b,async()=>{if(await act("product_delete",{id:b.dataset.id}))drawInv()});
ACT.psave=async()=>{const t=$("#ft").value,r=await act("product_save",{id:IV.edit,name:$("#fn").value,category:$("#fc").value,price:$("#fp").value,cost:$("#fo").value,qty:$("#fs").value,min_qty:$("#fm").value,
  track_imei:t==="imei",service:t==="service",barcode:$("#fb").value,warranty:$("#fw").value},"Saved");if(r){const wasNew=!IV.edit;IV.edit=null;await viewInv();if(wasNew&&t==="imei")toast("Saved — use the IMEIs button to add phones")}};
ACT.pimei=async b=>{const id=+b.dataset.id,p=(await api("products",{})).find(p=>p.id===id),L=await api("imeis",{product_id:id});
  openModal(`<h3>IMEIs — ${esc(p.name)}</h3><div class="mu">In stock: ${L.filter(i=>i.status==="in_stock").length}</div>${T(["IMEI","Status",""],L.map(i=>`<tr><td>${esc(i.imei)}</td><td>${tag(i.status==="in_stock"?"Active":i.status)}</td><td>${i.status==="in_stock"?`<button class="sm bad" data-a="imrm" data-id="${i.id}" data-p="${id}">Remove</button>`:""}</td></tr>`),"No IMEIs yet.")}
  <label>Add IMEIs (one per line, or scan them)</label><textarea id="imt" rows="4"></textarea><div class="row"><button data-a="mclose">Close</button><button class="pri" data-a="imadd" data-p="${id}">Add</button></div>`,true)};
ACT.imadd=async b=>{if(await act("imeis_add",{product_id:b.dataset.p,text:$("#imt").value},"IMEIs added")){await ACT.pimei({dataset:{id:b.dataset.p}});drawInv()}};
ACT.imrm=b=>sure(b,async()=>{if(await act("imei_remove",{id:b.dataset.id})){await ACT.pimei({dataset:{id:b.dataset.p}});drawInv()}});

async function viewCus(){
  $("#main").innerHTML=`<div class="card mb"><h3>Warranty check</h3><input id="wq" data-i="wq" placeholder="IMEI, receipt no., customer name or phone" value="${esc(CU.wq)}"><div id="wr" style="margin-top:8px"></div></div>
  <div class="card mb"><h3>Add customer</h3><div class="form"><div><label>Name</label><input id="cn"></div><div><label>Phone</label><input id="cp"></div><div><label>Address</label><input id="ca"></div><div><button class="pri" data-a="cadd">Add</button></div></div></div>

async function drawWar(){const q=CU.wq.trim();if(!q){$("#wr").innerHTML="";return}const L=await api("warranty",{q}),n=todayS();
  $("#wr").innerHTML=L.map(r=>{const w=r.warranty_until?(r.warranty_until>=n?`<b class="okc">Warranty active until ${r.warranty_until}</b>`:`<b class="low">Warranty expired ${r.warranty_until}</b>`):'<span class="mu">No warranty</span>';
    return`<div class="line"><div class="row"><span>${esc(r.name)}${r.imei?" · "+esc(r.imei):""}</span>${w}</div><small class="mu">Receipt #${r.sale_id} · ${fd(r.date)}${r.customer?" · "+esc(r.customer):""}</small></div>`}).join("")||'<p class="mu">No match.</p>'}
INP.wq=el=>{CU.wq=el.value;drawWar()};INP.cq=el=>{CU.q=el.value;drawCus()};
ACT.cdebt=b=>{CU.debt=CU.debt?0:1;b.classList.toggle("on");drawCus()};
async function drawCus(){const L=await api("customers",{q:CU.q,debtors:CU.debt});
  $("#clist").innerHTML=T(["Name","Phone","Points","Balance","Purchases","Spent","Active warranties",""],L.map(c=>`<tr><td><a href="#" data-a="cprof" data-id="${c.id}" style="color:var(--ac)">${esc(c.name)}</a></td><td>${esc(c.phone)}</td><td>${c.points}</td><td class="${c.balance>0?"low":""}">${c.balance>0?money(c.balance):"—"}</td><td>${c.purchases}</td><td>${money(c.spent)}</td><td>${c.warranties}</td>
  <td><button class="sm" data-a="cprof" data-id="${c.id}">Open</button> ${c.balance>0?`<button class="sm pri" data-a="cpay" data-id="${c.id}" data-b="${c.balance}">Pay</button> <button class="sm" data-a="wa" data-n="${esc(c.name)}" data-p="${esc(c.phone)}" data-m="${c.balance}">Remind</button> `:""}<button class="sm" data-a="cedit" data-id="${c.id}">Edit</button> <button class="sm bad" data-a="cdel" data-id="${c.id}">Delete</button></td></tr>`),"No customers yet.")}
ACT.cadd=async()=>{if(await act("customer_save",{name:$("#cn").value,phone:$("#cp").value,address:$("#ca").value},"Customer added"))viewCus()};
ACT.cdel=b=>sure(b,async()=>{if(await act("customer_delete",{id:b.dataset.id}))drawCus()});
ACT.cedit=async b=>{const r=await api("customer_get",{id:b.dataset.id}),c=r.customer;
  const d=await askForm("Edit customer",[{k:"name",l:"Name"},{k:"phone",l:"Phone"},{k:"address",l:"Address"},{k:"notes",l:"Notes"}],c);if(d&&await act("customer_save",{...d,id:c.id}))drawCus()};
ACT.cpay=async b=>{const d=await askForm("Receive payment",[{k:"amount",l:"Amount (in the chosen currency)",t:"number"},{k:"cur",l:"Currency",t:"select",o:["USD","LBP"]},{k:"method",l:"Method",t:"select",o:METHODS},{k:"note",l:"Note"}],{amount:fix(b.dataset.b),cur:"USD",method:"Cash"});
  if(d&&await act("customer_pay",{id:b.dataset.id,...d},"Payment saved")){if($("#clist"))drawCus();if(PROF)ACT.cprof({dataset:{id:PROF}})}};

const CALCK=["C","(",")","÷","7","8","9","×","4","5","6","−","1","2","3","+","0",".","⌫","="];
function calcEval(s){s=String(s).replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-").replace(/,/g,"").trim();if(!s||!/^[0-9+\-*/().\s]+$/.test(s))return null;try{const v=Function('"use strict";return ('+s+')')();return Number.isFinite(v)?Math.round(v*1e8)/1e8:null}catch(e){return null}}
ACT.calcopen=()=>{openModal(`<h3>Calculator</h3><input id="cd" autocomplete="off" inputmode="decimal" placeholder="0" style="font-size:calc(22px*var(--fs,1));text-align:right"><div id="cr" class="mu right" style="min-height:22px;margin:4px 0"></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${CALCK.map(k=>`<button class="${k==="="?"pri":""}" data-a="ck" data-k="${k}" style="padding:12px 0;font-size:calc(17px*var(--fs,1))">${k}</button>`).join("")}</div>
  <div class="row" style="margin-top:8px"><button class="sm" data-a="ck" data-k="usd">$ → L.L</button><button class="sm" data-a="ck" data-k="lbp">L.L → $</button><button class="sm" data-a="mclose">Close</button></div>`);
  const d=$("#cd");d.focus();d.oninput=()=>{const v=calcEval(d.value);$("#cr").textContent=v==null||d.value.trim()===""?"":"= "+v.toLocaleString("en-US",{maximumFractionDigits:8})};
  d.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();ACT.ck({dataset:{k:"="}})}}};
ACT.ck=b=>{const d=$("#cd"),k=b.dataset.k;if(!d)return;
  if(k==="C")d.value="";else if(k==="⌫")d.value=d.value.slice(0,-1);
  else if(k==="="){const v=calcEval(d.value);if(v!=null)d.value=String(v)}
  else if(k==="usd"||k==="lbp"){const v=calcEval(d.value);if(v==null)return;if(!rate())return toast("Set the exchange rate in Settings first");
    $("#cr").textContent=k==="usd"?v.toLocaleString("en-US")+" $ = "+Math.round(v*rate()).toLocaleString("en-US")+" L.L":v.toLocaleString("en-US")+" L.L = "+(v/rate()).toFixed(4)+" $";
    d.value=String(k==="usd"?Math.round(v*rate()):Math.round(v/rate()*1e4)/1e4);d.focus();return}
  else d.value+=k;
  d.focus();d.oninput&&d.oninput()};

const C39={"0":"101001101101","1":"110100101011","2":"101100101011","3":"110110010101","4":"101001101011","5":"110100110101","6":"101100110101","7":"101001011011","8":"110100101101","9":"101100101101","A":"110101001011","B":"101101001011","C":"110110100101","D":"101011001011","E":"110101100101","F":"101101100101","G":"101010011011","H":"110101001101","I":"101101001101","J":"101011001101","K":"110101010011","L":"101101010011","M":"110110101001","N":"101011010011","O":"110101101001","P":"101101101001","Q":"101010110011","R":"110101011001","S":"101101011001","T":"101011011001","U":"110010101011","V":"100110101011","W":"110011010101","X":"100101101011","Y":"110010110101","Z":"100110110101","-":"100101011011",".":"110010101101"," ":"100110101101","*":"100101101101"};
function code39(t){const s="*"+String(t).toUpperCase().replace(/[^0-9A-Z\-. ]/g,"")+"*";let x=0,b="";for(const ch of s){const p=C39[ch];if(!p)continue;for(let i=0;i<12;i++){if(p[i]==="1")b+=`<rect x="${x}" y="0" width="1" height="40"/>`;x++}x++}
  return`<svg viewBox="0 0 ${x} 40" preserveAspectRatio="none" style="width:100%;height:38px;background:#fff" fill="#000">${b}</svg>`}
async function labelSheet(list){if(!list.length)return toast("Nothing to print");const d=await askForm("Print labels",[{k:"copies",l:"Copies of each label",t:"number"}],{copies:1});if(!d)return;const n=Math.max(1,Math.min(50,Math.floor(+d.copies||1)));
  const cells=list.flatMap(p=>Array(n).fill(0).map(()=>`<div style="border:1px dashed #999;border-radius:6px;padding:6px;text-align:center;break-inside:avoid;color:#000;background:#fff"><div style="font-size:calc(12px*var(--fs,1));font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(p.name)}</div>${code39(p.barcode)}<div style="font-size:calc(11px*var(--fs,1))">${esc(p.barcode)}</div><b>${money(p.price)}</b></div>`)).join("");
  openModal(`<h3>Labels</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${cells}</div><div class="row"><button class="pri" data-a="printl">Print</button><button data-a="mclose">Close</button></div>`,true)}

function provNode(n){if(PROV!=="touch")return;const p=n.parentElement;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName)||!p.closest("#main,#modal"))return;reAlfa.lastIndex=0;if(reAlfa.test(n.nodeValue)){reAlfa.lastIndex=0;n.nodeValue=n.nodeValue.replace(reAlfa,"Touch")}reAlfa.lastIndex=0}
function provEl(root){if(PROV!=="touch"||(root.closest&&!root.closest("#main,#modal")&&!root.querySelector("#main,#modal")))return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(provNode);
  if(root.querySelectorAll)root.querySelectorAll("[placeholder],[title]").forEach(e=>["placeholder","title"].forEach(a=>{const v=e.getAttribute(a);if(v&&/\bAlfa\b/.test(v))e.setAttribute(a,v.replace(/\bAlfa\b/g,"Touch"))}))}

async function drawUpdates(){const b=$("#updbox");if(!b)return;let i;try{i=await api("update_info")}catch(e){return}

ACT.updpick=()=>{const f=document.createElement("input");f.type="file";f.accept=".zip";f.onchange=async()=>{const file=f.files[0];if(!file)return;
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(file)});
  const r=await act("update_check",{b64});if(!r)return;UPD={b64,ver:r.d.version};const rel={newer:"newer than the version you are using",same:"the same version you are using",older:"OLDER than the version you are using"}[r.d.relation];
  const d=await askForm("Update found: "+r.d.version,pwField(),{},"Install "+r.d.version+" and restart");if(!d)return;
  if(r.d.notes)toast("What's new: "+r.d.notes.replace(/\s+/g," ").slice(0,160),9000);
  const q=await act("update_install",{b64,password:d.password||""});if(!q)return;restartScreen(q.d)};
  f.click()};

function trText(n){if(LANG!=="ar")return;const p=n.parentElement;if(!p||/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName))return;const t=n.nodeValue,k=t.trim();if(k&&AR[k])n.nodeValue=t.replace(k,AR[k])}
function trEl(root){if(LANG!=="ar")return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(trText);
  if(root.querySelectorAll)root.querySelectorAll("[placeholder],[title]").forEach(e=>["placeholder","title"].forEach(a=>{const v=e.getAttribute(a);if(v&&AR[v])e.setAttribute(a,AR[v])}))}

ACT.setsave=async()=>{const d={};$$("#sf1 input,#sf2 input").forEach(i=>d[i.dataset.k]=i.value);d.auto_backup=$("#c1").checked?"1":"0";d.auto_drive=$("#c2").checked?"1":"0";d.allow_negative=$("#c3").checked?"1":"0";d.auto_summary=$("#c4").checked?"1":"0";d.lang=$("#lang").value;const langChanged=d.lang!==(SET.lang||"en");d.lan_mode=$("#c5").checked?"1":"0";const lanChanged=d.lan_mode!==(SET.lan_mode||"0");
  if(await act("settings_save",d,"Settings saved")){await boot();if(lanChanged)toast("Restart the program to apply the network setting",7000);if(langChanged)location.reload();else render()}};
CHG.csv=async el=>{const f=el.files[0];if(!f)return;const r=await act("import_csv",{text:await f.text()});if(r)toast(r.d+" products imported")};
ACT.fold=b=>act("open_folder",{which:b.dataset.w});
ACT.bnow=async()=>{if(await act("backup_now",{},"Backup created"))viewSet()};
ACT.bdrive=async b=>{toast("Uploading to Google Drive…",20000);const r=await act("backup_drive",{name:b.dataset.n});if(r)toast(r.d,6000);viewSet()};
ACT.bmail=async()=>{toast("Sending email…",20000);const r=await act("backup_email",{});if(r)toast(r.d,6000);viewSet()};
ACT.brest=b=>sure(b,async()=>{if(await act("backup_restore",{name:b.dataset.n},"Backup restored")){await boot();go("home")}});

/* ================= shell ================= */
const TABS=[["home","Home",viewHome],["dash","Dashboard",viewDash],["sell","Sell",viewSell],["sales","Sales",viewSales],["inv","Inventory",viewInv],["alfa","Alfa",()=>{PROV="alfa";resetProv();AL.type="svc";return viewAlfa()}],["touch","Touch",()=>{PROV="touch";TMODE="sell";resetProv();AL.type="svc";return viewAlfa()}],["day","Day summary",viewDay],["cnt","Stock count",viewCount],["trd","Trade-in",viewTradein],["wty","Warranty",viewClaims],["cus","Customers",viewCus],["debt","Installments",viewDebt],["sup","Suppliers",viewSup],["rep","Repairs",viewRep],["exp","Expenses",viewExp],["off","Offers",viewOff],["rpt","Reports",viewRpt],["set","Settings",viewSet]];
function render(){$("#title").textContent=SET.shop_name||"Shop POS";document.title=$("#title").textContent;const lg=$("#logo");if(SET.logo){lg.src=SET.logo;lg.style.display=""}else lg.style.display="none";
  if(!visTabs().find(t=>t[0]===tab))tab="home";$("#nav").innerHTML=visTabs().map(t=>`<button data-a="tab" data-t="${t[0]}" class="${t[0]===tab?"on":""}">${t[1]}</button>`).join("");
  $("#lockb").style.display=ME.has_users?"":"none";
  (setTabPic(),applyDisp(),tab!=="touch"&&(PROV="alfa"),TABS.find(t=>t[0]===tab)[2])().catch(e=>{$("#main").innerHTML=`<div class="card low">${esc(e.message)}</div>`})}
function go(t){tab=t;if(t!=="sup")PD=null;render()}
ACT.tab=b=>go(b.dataset.t);
ACT.theme=()=>{const d=document.documentElement,dark=getComputedStyle(d).colorScheme==="dark";d.dataset.theme=dark?"light":"dark";try{localStorage.setItem("theme",d.dataset.theme)}catch(e){}};
ACT.lock=async()=>{try{await api("logout")}catch(e){}sessionStorage.removeItem("sess");ME.user="";showLock()};
async function showLock(){let u;try{u=await api("users_public")}catch(e){return}ME.has_users=u.has_users;if(!u.has_users){$("#lock").style.display="none";return}
  $("#lkhead").innerHTML=`${SET.logo?`<img src="${SET.logo}" alt="" style="height:84px;max-width:100%;border-radius:12px">`:""}<div style="font-size:28px;font-weight:700;margin-top:8px;line-height:1.2">${esc(SET.shop_name||"Shop POS")}</div><div class="mu">Sign in to continue</div>`;
  let last="";try{last=localStorage.getItem("lastuser")||""}catch(e){}
  $("#luser").value=last;$("#pin").value="";$("#pin").type="password";$("#pinerr").textContent="";$("#lock").style.display="flex";(last?$("#pin"):$("#luser")).focus()}
ACT.unlock=async()=>{const un=$("#luser").value.trim();if(!un||!$("#pin").value){$("#pinerr").textContent="Enter your username and password";return}
  try{const lr=await api("login",{username:un,password:$("#pin").value});sessionStorage.setItem("sess",lr.session);try{localStorage.setItem("lastuser",un)}catch(e){}$("#lock").style.display="none";await boot();go("home")}catch(e){$("#pinerr").textContent=e.message;$("#pin").value=""}};
ACT.eye=b=>{const p=$("#pin");p.type=p.type==="password"?"text":"password";b.textContent=p.type==="password"?"Show":"Hide";p.focus()};
ACT.forgot=async()=>{const d=await askForm("Reset the owner password",[{k:"username",l:"Owner username"},{k:"code",l:"Recovery code (like K7QM-4D2P-9XTR)"},{k:"password",l:"New password (6 or more characters)",t:"password"}],{username:$("#luser").value},"Reset password");
  if(!d)return;try{const r=await api("recover",d);showRecovery(r.recovery,"Password changed. Your new recovery code:")}catch(e){toast(e.message,6000)}};
function showRecovery(code,msg){openModal(`<h3>Owner recovery code</h3><p class="mu">${esc(msg||"Write this code down and keep it somewhere safe. It is shown only once and it is the only way back in if the owner password is forgotten.")}</p><div style="font:600 24px/1.4 ui-monospace,Consolas,monospace;letter-spacing:2px;text-align:center;margin:12px 0">${esc(code)}</div><div class="row"><button data-a="print">Print</button><button class="pri" data-a="mclose">I saved it</button></div>`)}
let idleT=null;const idleReset=()=>{clearTimeout(idleT);const m=+SET.autolock_min||0;if(m>0&&ME.has_users&&ME.user)idleT=setTimeout(()=>ACT.lock(),m*6e4)};
["mousemove","keydown","click","touchstart"].forEach(ev=>document.addEventListener(ev,idleReset,{passive:true}));
$("#luser").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#pin").focus()}});
$("#pin").addEventListener("keydown",e=>{if(e.key==="Enter")ACT.unlock()});
async function boot(){const b=await api("boot");SET=b.settings;INFO=b;ME=b.me;$("#sync").textContent=b.version+(ME.user?" · "+ME.user+" ("+ME.role+")":"");applyAccent();applyPrintStyle();LANG=SET.lang||"en";startLang();idleReset()}
(async()=>{try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
  try{await boot()}catch(e){document.body.innerHTML="<p>Could not start: "+esc(e.message)+"</p>";return}
  if(ME.has_users&&!ME.user)showLock();else render();setInterval(()=>api("ping").catch(()=>{}),5000)})();
</script></body></html>
